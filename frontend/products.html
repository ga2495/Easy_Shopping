<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products — ShopEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #e8c97e;
      --accent2: #c9a84c;
      --text: #f0ede8;
      --muted: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* Navbar */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 60px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-user {
      font-size: 14px;
      color: var(--muted);
    }

    .nav-btn {
      padding: 9px 20px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn.cart {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .nav-btn.cart:hover { border-color: var(--accent); color: var(--accent); }

    .nav-btn.logout {
      background: transparent;
      color: var(--muted);
      border: none;
    }

    .nav-btn.logout:hover { color: var(--text); }

    /* Hero */
    .hero {
      padding: 50px 60px 30px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      margin-bottom: 6px;
    }

    .hero p { color: var(--muted); font-size: 15px; }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      padding: 10px 16px;
      padding-right: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      width: 240px;
      transition: border-color 0.2s, width 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      width: 280px;
    }

    /* Filter bar */
    .filter-bar {
      padding: 20px 60px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .filter-btn {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232,201,126,0.08);
    }

    /* Products grid */
    .products-section {
      padding: 40px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: rgba(232,201,126,0.4);
      transform: translateY(-4px);
    }

    .card-img {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-category {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .card-name {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .card-stock {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .price {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .price span {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .add-btn {
      padding: 9px 16px;
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .add-btn:hover { background: var(--accent2); }
    .add-btn:active { transform: scale(0.96); }
    .add-btn:disabled { background: #333; color: var(--muted); cursor: not-allowed; }

    .edit-btn {
      padding: 7px 12px;
      background: transparent;
      border: 1px solid rgba(232,201,126,0.4);
      color: var(--accent);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .edit-btn:hover { background: rgba(232,201,126,0.1); }

    .delete-btn {
      padding: 7px 12px;
      background: transparent;
      border: 1px solid rgba(229,115,115,0.4);
      color: #e57373;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .delete-btn:hover { background: rgba(229,115,115,0.1); }

    .loading {
      text-align: center;
      padding: 80px;
      color: var(--muted);
      font-size: 16px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1a1a1a;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 500;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      width: 100%; max-width: 480px;
      padding: 32px;
    }
    .modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 7px;
    }
    .field input, .field textarea, .field select {
      width: 100%; padding: 11px 14px;
      background: #0f0f0f; border: 1px solid #2a2a2a;
      border-radius: 8px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--accent);
    }
    .modal-btns { display: flex; gap: 10px; margin-top: 12px; }
    .modal-btns .save-btn {
      flex: 1; padding: 13px;
      background: var(--accent); color: #0f0f0f;
      border: none; border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .modal-btns .save-btn:hover { background: var(--accent2); }
    .modal-btns .cancel-btn {
      flex: 1; padding: 13px;
      background: transparent; color: var(--muted);
      border: 1px solid #2a2a2a; border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .modal-btns .cancel-btn:hover { color: var(--text); border-color: var(--muted); }
    .msg { margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 6px; display: none; }
    .msg.error   { background: rgba(229,115,115,0.15); color: #e57373; display: block; }
    .msg.success { background: rgba(129,199,132,0.15); color: #81c784; display: block; }

    @media (max-width: 768px) {
      nav, .hero, .filter-bar, .products-section { padding-left: 20px; padding-right: 20px; }
      .hero h1 { font-size: 28px; }
      .search-box input { width: 100%; }
      .hero-actions { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="brand" href="products.html">ShopEase</a>
    <div class="nav-right">
      <span class="nav-user" id="nav-user"></span>
      <a class="nav-btn cart" href="orders.html">📦 My Orders</a>
      <a class="nav-btn cart" href="cart.html">🛒 Cart</a>
      <button class="nav-btn logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="hero">
    <div>
      <h1>Our Products</h1>
      <p>Discover our curated collection of premium products</p>
    </div>
    <div class="hero-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products..." oninput="handleSearch()" />
      </div>
      <button class="add-btn" id="addProductBtn" style="display:none" onclick="openAddModal()">
        + Add Product
      </button>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
  </div>

  <div class="products-section">
    <div class="grid" id="grid">
      <div class="loading">Loading products...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Add/Edit Product Modal (Admin) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Add New Product</h2>
      <input type="hidden" id="editProductId" value="" />
      <div class="field">
        <label>Product Name</label>
        <input type="text" id="pName" placeholder="e.g. iPhone 15 Pro" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="pDesc" rows="2" placeholder="Short description..."></textarea>
      </div>
      <div class="field">
        <label>Price (₹)</label>
        <input type="number" id="pPrice" placeholder="e.g. 79999" step="0.01" />
      </div>
      <div class="field">
        <label>Stock</label>
        <input type="number" id="pStock" placeholder="e.g. 50" min="0" />
      </div>
      <div class="field">
        <label>Category</label>
        <select id="pCategory">
          <option value="">Select category...</option>
        </select>
      </div>
      <div class="field">
        <label>Image URL (optional)</label>
        <input type="text" id="pImage" placeholder="https://..." />
      </div>
      <div class="msg" id="modal-msg"></div>
      <div class="modal-btns">
        <button class="save-btn" id="saveProductBtn" onclick="saveProduct()">Save Product</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    if (!token) window.location.href = 'login.html';

    document.getElementById('nav-user').textContent = `Hi, ${user.name || 'User'}`;

    let allProducts = [];
    let currentCategory = 'all';
    let currentSearch = '';

    const ICONS = {
      'Mobiles': '📱', 'Laptops': '💻', 'Electronics': '🔌',
      "Men's Clothing": '👕', "Women's Clothing": '👗',
      'default': '🛍️'
    };

    async function loadProducts() {
      try {
        const res = await fetch(`${API}/products`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { window.location.href = 'login.html'; return; }
        allProducts = await res.json();
        renderFilters();
        applyFilters();
      } catch (err) {
        document.getElementById('grid').innerHTML = '<div class="loading">Failed to load products. Make sure the server is running.</div>';
      }
    }

    function renderFilters() {
      const categories = [...new Set(allProducts.map(p => p.category_name).filter(Boolean))];
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = '<button class="filter-btn active" onclick="filterCategory(\'all\', this)">All</button>';
      
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.onclick = () => filterCategory(cat, btn);
        bar.appendChild(btn);
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyFilters();
    }

    function handleSearch() {
      currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
      applyFilters();
    }

    function applyFilters() {
      let filtered = allProducts;

      if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category_name === currentCategory);
      }

      if (currentSearch) {
        filtered = filtered.filter(p =>
          (p.name && p.name.toLowerCase().includes(currentSearch)) ||
          (p.description && p.description.toLowerCase().includes(currentSearch))
        );
      }

      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = document.getElementById('grid');
      if (products.length === 0) {
        grid.innerHTML = '<div class="loading">No products match your search or filter.</div>';
        return;
      }
      grid.innerHTML = products.map(p => `
        <div class="card">
          <div>
            <div class="card-img">${ICONS[p.category_name] || ICONS.default}</div>
            <div class="card-body">
              <div>
                <div class="card-category">${p.category_name || 'General'}</div>
                <div class="card-name">${escapeHtml(p.name)}</div>
                <div class="card-desc">${escapeHtml(p.description || '')}</div>
                <div class="card-stock">${p.stock > 0 ? `In Stock (${p.stock})` : '<span style="color:#e57373">Out of Stock</span>'}</div>
              </div>
              <div class="card-footer">
                <div class="price">₹${Number(p.price).toLocaleString('en-IN')} <span>incl. taxes</span></div>
                <div class="card-actions">
                  <button class="add-btn" onclick="addToCart(${p.id}, this)" ${p.stock === 0 ? 'disabled' : ''}>
                    ${p.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
                  </button>
                  ${user.role === 'admin' ? `
                    <button class="edit-btn" onclick="openEditModal(${p.id})">Edit</button>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function addToCart(productId, btn) {
      btn.disabled = true;
      const origText = btn.textContent;
      btn.textContent = 'Adding...';
      try {
        const res = await fetch(`${API}/cart/add`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ product_id: productId, quantity: 1 })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('✓ Added to cart!');
        } else {
          showToast(data.error || 'Failed to add item.');
        }
      } catch {
        showToast('Connection error.');
      }
      btn.disabled = false;
      btn.textContent = origText;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── Admin Features ─────────────────────────────────────
    if (user.role === 'admin') {
      document.getElementById('addProductBtn').style.display = 'inline-block';
      loadCategoriesForModal();
    }

    async function loadCategoriesForModal() {
      try {
        const res  = await fetch(`${API}/categories`);
        const cats = await res.json();
        const select = document.getElementById('pCategory');
        select.innerHTML = '<option value="">Select category...</option>';

        cats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.textContent = cat.name;
          select.appendChild(opt);

          (cat.subcategories || []).forEach(sub => {
            const subOpt = document.createElement('option');
            subOpt.value = sub.id;
            subOpt.textContent = '↳ ' + sub.name;
            select.appendChild(subOpt);
          });
        });
      } catch(e) {}
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add New Product';
      document.getElementById('editProductId').value = '';
      document.getElementById('saveProductBtn').textContent = 'Add Product';
      ['pName', 'pDesc', 'pPrice', 'pStock', 'pImage', 'pCategory'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('modal-msg').className = 'msg';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openEditModal(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;

      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('editProductId').value = product.id;
      document.getElementById('saveProductBtn').textContent = 'Save Changes';
      document.getElementById('pName').value = product.name || '';
      document.getElementById('pDesc').value = product.description || '';
      document.getElementById('pPrice').value = product.price || '';
      document.getElementById('pStock').value = product.stock !== undefined ? product.stock : '';
      document.getElementById('pCategory').value = product.category_id || '';
      document.getElementById('pImage').value = product.image_url || '';
      document.getElementById('modal-msg').className = 'msg';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('modal-msg').className = 'msg';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('modalOverlay');
      if (overlay) {
        overlay.addEventListener('click', function(e) {
          if (e.target === this) closeModal();
        });
      }
    });

    async function saveProduct() {
      const editId      = document.getElementById('editProductId').value;
      const name        = document.getElementById('pName').value.trim();
      const description = document.getElementById('pDesc').value.trim();
      const price       = document.getElementById('pPrice').value;
      const stock       = document.getElementById('pStock').value;
      const category_id = document.getElementById('pCategory').value;
      const image_url   = document.getElementById('pImage').value.trim();
      const msg         = document.getElementById('modal-msg');
      msg.className     = 'msg';

      if (!name || price === '' || stock === '') {
        msg.className   = 'msg error';
        msg.textContent = 'Name, price, and stock are required.';
        return;
      }

      const isEdit = Boolean(editId);
      const url = isEdit ? `${API}/products/${editId}` : `${API}/products`;
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, description, price, stock, category_id, image_url })
        });
        const data = await res.json();

        if (res.ok) {
          msg.className   = 'msg success';
          msg.textContent = isEdit ? 'Product updated successfully!' : 'Product added successfully!';
          setTimeout(() => { closeModal(); loadProducts(); }, 1000);
        } else {
          msg.className   = 'msg error';
          msg.textContent = data.error || 'Failed to save product.';
        }
      } catch(e) {
        msg.className   = 'msg error';
        msg.textContent = 'Connection error.';
      }
    }

    async function deleteProduct(productId) {
      if (!confirm('Are you sure you want to delete this product?')) return;

      try {
        const res = await fetch(`${API}/products/${productId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          showToast('Product deleted.');
          loadProducts();
        } else {
          const data = await res.json();
          showToast(data.error || 'Delete failed.');
        }
      } catch(e) {
        showToast('Connection error.');
      }
    }

    loadProducts();
  </script>
</body>
</html>
